# Nginx reverse-proxy for the rate-limiter gateway.
#
# Traffic flows:
#   Client → nginx:80 → (round-robin) → app1:3000 | app2:3000
#
# Both app instances share the same Redis, so rate-limit counters are
# global.  The load test proves this: fire 100 requests with a free-tier
# key (limit 60/min) and exactly 60 should be allowed in total, not 120.
#
# OBSERVABILITY
# -------------
# add_header X-Upstream-Addr exposes which backend handled each request.
# The load test reads this header and prints per-instance distribution.

events {
    worker_connections 1024;
}

http {
    # ── Upstream pool (round-robin by default) ────────────────────────────
    upstream app_backend {
        server app1:3000;
        server app2:3000;
        # keepalive: reuse up to 32 connections per worker to each upstream,
        # avoiding TCP handshake overhead on every request.
        keepalive 32;
    }

    # ── Logging ───────────────────────────────────────────────────────────
    log_format main '$remote_addr - $upstream_addr [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_x_api_key"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Server ────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Surface which backend instance served each response.
        # The load-test reads X-Served-By (set by Express) for its summary.
        # X-Upstream-Addr is set by nginx itself and contains the raw IP:port.
        add_header X-Upstream-Addr $upstream_addr always;

        location / {
            proxy_pass         http://app_backend;

            # Use HTTP/1.1 so keepalive connections to upstreams work.
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";   # clear "close" from HTTP/1.0
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Forward API key header unchanged.
            proxy_set_header   X-API-Key         $http_x_api_key;

            # Timeouts suitable for local dev; tighten for production.
            proxy_connect_timeout 5s;
            proxy_read_timeout    10s;
        }

        # Lightweight nginx health endpoint (no app involved).
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
