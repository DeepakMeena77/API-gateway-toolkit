# Nginx config for the React dashboard container.
#
# Responsibilities:
#  1. Serve the Vite build output as static files.
#  2. SPA fallback: non-existent paths → index.html (handles React routing).
#  3. Proxy /analytics (and sub-paths) to the gateway nginx, so the
#     browser never makes cross-origin requests.
#
# In docker-compose the gateway service is named "gateway", so
# http://gateway resolves via Docker's internal DNS.

server {
    listen 80;
    root  /usr/share/nginx/html;
    index index.html;

    # ── Static asset serving ──────────────────────────────────────────────
    # Serve pre-built JS/CSS with long cache lifetimes (Vite hashes filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy ─────────────────────────────────────────────────────────
    # Forward /analytics/* to the gateway (which round-robins to app1/app2).
    location /analytics {
        proxy_pass         http://gateway/analytics;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Disable buffering so streamed responses arrive promptly.
        proxy_buffering    off;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    # Any path not matched above falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
